    <text x="60" y="191" fill="#F1FFF5" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="68" font-weight="750" letter-spacing="-3">Chase Struse<tspan fill="#79EDA5">.</tspan></text>
