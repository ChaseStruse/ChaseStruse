<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Chase Struse</title>
  <desc id="desc">Developer since 2018. Python, cloud, and Celtics basketball. A dark green banner with basketball court line art.</desc>
  <defs>
